id = "chunk_text"
entry_point = "chunk_text"
prompt = """
Write chunk_text(text: str, max_len: int) -> list[str] that splits text into chunks of at most max_len
characters. Split on whitespace: words in a chunk are joined by single spaces, and a chunk is filled with as
many whole words as fit. A word longer than max_len is cut into pieces of exactly max_len characters (the
last piece may be shorter), and each piece is its own chunk. Return [] for text with no words. Raise
ValueError if max_len < 1.
"""
tests = """
assert chunk_text("the quick brown fox", 9) == ["the quick", "brown fox"]
assert chunk_text("", 5) == []
"""
hidden_tests = """
assert chunk_text("a  b   c", 3) == ["a b", "c"]
assert chunk_text("abcdefghij", 4) == ["abcd", "efgh", "ij"]
assert chunk_text("hi abcdefgh yo", 4) == ["hi", "abcd", "efgh", "yo"]
assert chunk_text("one", 3) == ["one"]
assert raises(ValueError, chunk_text, "x", 0)
assert chunk_text("   ", 4) == []
"""
reference = '''
def chunk_text(text, max_len):
    if max_len < 1:
        raise ValueError(max_len)
    chunks, current = [], ""
    for word in text.split():
        pieces = [word[i:i + max_len] for i in range(0, len(word), max_len)]
        for piece in pieces:
            if not current:
                current = piece
            elif len(current) + 1 + len(piece) <= max_len and len(pieces) == 1:
                current += " " + piece
            else:
                chunks.append(current)
                current = piece
        if len(pieces) > 1:
            chunks.append(current)
            current = ""
    if current:
        chunks.append(current)
    return chunks
'''

