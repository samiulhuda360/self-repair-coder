id = "semver_compare"
entry_point = "semver_compare"
prompt = """
Write semver_compare(a: str, b: str) -> int that compares two semantic versions such as "1.4.2" or
"2.0.0-rc.1" and returns -1, 0 or 1. Compare major, minor and patch as numbers. A version with a pre-release
part (after "-") is lower than the same version without one. Pre-release parts are compared identifier by
identifier, split on ".": numeric identifiers compare as numbers and are lower than text identifiers, text
compares as ASCII, and if all shared identifiers are equal the shorter list is lower. Ignore build metadata
after "+".
"""
tests = """
assert semver_compare("1.0.0", "2.0.0") == -1
assert semver_compare("1.0.0-alpha", "1.0.0") == -1
assert semver_compare("1.2.3", "1.2.3") == 0
"""
hidden_tests = """
assert semver_compare("1.10.0", "1.9.0") == 1
assert semver_compare("1.0.0-alpha.1", "1.0.0-alpha") == 1
assert semver_compare("1.0.0-alpha.beta", "1.0.0-alpha.1") == 1
assert semver_compare("1.0.0-rc.10", "1.0.0-rc.2") == 1
assert semver_compare("1.0.0+build.5", "1.0.0") == 0
assert semver_compare("1.0.0-beta", "1.0.0-alpha") == 1
"""
reference = '''
def semver_compare(a, b):
    def parse(version):
        version = version.split("+", 1)[0]
        core, _, pre = version.partition("-")
        nums = tuple(int(x) for x in core.split("."))
        return nums, (pre.split(".") if pre else [])

    def cmp(x, y):
        return (x > y) - (x < y)

    (na, pa), (nb, pb) = parse(a), parse(b)
    if na != nb:
        return cmp(na, nb)
    if not pa or not pb:
        return cmp(not pa, not pb)
    for x, y in zip(pa, pb):
        if x == y:
            continue
        if x.isdigit() and y.isdigit():
            return cmp(int(x), int(y))
        if x.isdigit() != y.isdigit():
            return -1 if x.isdigit() else 1
        return cmp(x, y)
    return cmp(len(pa), len(pb))
'''

