prompt = "days_in_month(year, month) returns the number of days in that month of the Gregorian calendar, and raises ValueError for a month outside 1-12."
starter_code = '''
def days_in_month(year, month):
    if month == 2:
        return 29 if year % 4 == 0 else 28
    if month in (4, 6, 9, 11):
        return 30
    return 31
'''
tests = """
assert days_in_month(2024, 2) == 29
assert days_in_month(1900, 2) == 28
assert days_in_month(2023, 4) == 30
"""
hidden_tests = """
assert days_in_month(2000, 2) == 29
assert days_in_month(2023, 2) == 28
assert days_in_month(2023, 12) == 31
assert raises(ValueError, days_in_month, 2023, 13)
assert raises(ValueError, days_in_month, 2023, 0)
"""
reference = '''
def days_in_month(year, month):
    if not 1 <= month <= 12:
        raise ValueError(month)
    if month == 2:
        leap = year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)
        return 29 if leap else 28
    if month in (4, 6, 9, 11):
        return 30
    return 31
'''

