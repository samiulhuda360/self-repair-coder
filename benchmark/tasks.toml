id = "wildcard_match"
entry_point = "wildcard_match"
prompt = """
Write wildcard_match(pattern: str, text: str) -> bool. The pattern must match the whole text. "?" matches
exactly one character, "*" matches any sequence including an empty one, and a backslash makes the next
character literal (so "\\*" matches a literal star and "\\\\" a literal backslash). A trailing lone
backslash matches a literal backslash. Do not use fnmatch or re.
"""
tests = """
assert wildcard_match("*.py", "main.py") is True
assert wildcard_match("a?c", "abc") is True
assert wildcard_match("a\\\\*c", "a*c") is True
assert wildcard_match("a\\\\*c", "abc") is False
"""
hidden_tests = """
assert wildcard_match("", "") is True
assert wildcard_match("*", "") is True
assert wildcard_match("?", "") is False
assert wildcard_match("a*b*c", "aXXbYYc") is True
assert wildcard_match("a*b*c", "aXXbYY") is False
assert wildcard_match("\\\\?", "?") is True
assert wildcard_match("\\\\?", "x") is False
assert wildcard_match("x\\\\", "x\\\\") is True
assert wildcard_match("**a", "bba") is True
assert wildcard_match("*" * 30 + "b", "a" * 40) is False
"""
reference = '''
def wildcard_match(pattern, text):
    tokens = []
    i = 0
    while i < len(pattern):
        ch = pattern[i]
        if ch == "\\":
            tokens.append(("lit", pattern[i + 1] if i + 1 < len(pattern) else "\\"))
            i += 2
        elif ch in "*?":
            tokens.append((ch, ""))
            i += 1
        else:
            tokens.append(("lit", ch))
            i += 1
    n = len(text)
    reach = [False] * (n + 1)
    reach[0] = True
    for kind, value in tokens:
        nxt = [False] * (n + 1)
        if kind == "*":
            seen = False
            for j in range(n + 1):
                seen = seen or reach[j]
                nxt[j] = seen
        else:
            for j in range(n):
                if reach[j] and (kind == "?" or text[j] == value):
                    nxt[j + 1] = True
        reach = nxt
    return reach[n]
'''

