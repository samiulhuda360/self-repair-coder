id = "justify"
entry_point = "justify"
prompt = """
Write justify(words: list[str], width: int) -> list[str] that lays words out in lines of exactly width
characters. Fill each line greedily with as many words as fit with at least one space between them. Spread
the extra spaces of a line as evenly as possible between its words; when they do not divide evenly, the gaps
on the left get one more space than those on the right. A line with a single word is left-aligned and padded
with spaces on the right. The last line is left-aligned with single spaces and padded on the right. Every
word is at most width characters long. Return [] for no words.
"""
tests = """
assert justify(["This", "is", "an", "example", "of", "text", "justification."], 16) == ["This    is    an", "example  of text", "justification.  "]
assert justify(["a"], 3) == ["a  "]
"""
hidden_tests = """
assert justify([], 5) == []
assert justify(["What", "must", "be", "acknowledgment", "shall", "be"], 16) == ["What   must   be", "acknowledgment  ", "shall be        "]
assert justify(["ab", "cd", "ef"], 7) == ["ab   cd", "ef     "]
assert justify(["a", "b", "c", "d"], 6) == ["a  b c", "d     "]
assert justify(["a", "b", "c", "d", "e"], 8) == ["a  b c d", "e       "]
"""
reference = '''
def justify(words, width):
    lines, current, length = [], [], 0
    for word in words:
        if current and length + len(current) + len(word) > width:
            lines.append(current)
            current, length = [], 0
        current.append(word)
        length += len(word)
    if current:
        lines.append(current)
    out = []
    for i, line in enumerate(lines):
        if i == len(lines) - 1 or len(line) == 1:
            out.append(" ".join(line).ljust(width))
            continue
        spaces = width - sum(len(w) for w in line)
        gaps = len(line) - 1
        text = ""
        for j, word in enumerate(line[:-1]):
            text += word + " " * (spaces // gaps + (1 if j < spaces % gaps else 0))
        out.append(text + line[-1])
    return out
'''

