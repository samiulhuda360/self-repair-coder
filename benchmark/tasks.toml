Write osa_distance(a: str, b: str) -> int, the optimal string alignment distance: the minimum number of
single-character insertions, deletions, substitutions and swaps of two adjacent characters needed to turn a
into b, where no substring is edited more than once. Comparison is case-sensitive.
"""
tests = """
