id = "format_table"
entry_point = "format_table"
prompt = """
Write format_table(headers: list[str], rows: list[list]) -> str that renders a plain-text table. Cell text:
None is an empty string, a float is shown with two decimals, anything else with str(). A column is numeric
when every non-None cell in it is an int or float (bool does not count) and it has at least one such cell;
numeric columns are right-aligned, including their header, and other columns are left-aligned. Each column
is as wide as its widest cell or header. Cells are joined with " | ". Under the header goes a separator line
made of "-" for each column's width, joined with "-+-". Strip trailing spaces from every line and join the
lines with "\\n".
"""
tests = """
assert format_table(["item", "qty"], [["apple", 3], ["kiwi", 12]]) == "item  | qty\\n------+----\\napple |   3\\nkiwi  |  12"
"""
hidden_tests = """
assert format_table(["n"], []) == "n\\n-"
assert format_table(["price", "note"], [[1.5, None], [None, "x"]]) == "price | note\\n------+-----\\n 1.50 |\\n      | x"
assert format_table(["flag", "v"], [[True, 1], [False, 22]]) == "flag  |  v\\n------+---\\nTrue  |  1\\nFalse | 22"
assert format_table(["a", "b"], [[None, "long text"]]) == "a | b\\n--+----------\\n  | long text"
"""
reference = '''
def format_table(headers, rows):
    def text(cell):
        if cell is None:
            return ""
        if isinstance(cell, float):
            return f"{cell:.2f}"
        return str(cell)

    def numeric(col):
        cells = [r[col] for r in rows if r[col] is not None]
        return bool(cells) and all(isinstance(c, (int, float)) and not isinstance(c, bool) for c in cells)

    cols = range(len(headers))
    widths = [max([len(headers[c])] + [len(text(r[c])) for r in rows]) for c in cols]
    right = [numeric(c) for c in cols]

    def line(cells):
        parts = [cells[c].rjust(widths[c]) if right[c] else cells[c].ljust(widths[c]) for c in cols]
        return " | ".join(parts).rstrip()

    out = [line(list(headers)), "-+-".join("-" * w for w in widths)]
    out += [line([text(r[c]) for c in cols]) for r in rows]
    return "\n".join(out)
'''

