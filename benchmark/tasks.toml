clockwise spiral order, starting at the top-left corner. Handle empty matrices and single rows or columns.
"""
tests = """
assert spiral_order([[1, 2, 3], [4, 5, 6], [7, 8, 9]]) == [1, 2, 3, 6, 9, 8, 7, 4, 5]
"""
