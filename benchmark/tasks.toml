id = "split_csv_line"
entry_point = "split_csv_line"
prompt = """
Write split_csv_line(line: str) -> list[str] that splits one CSV line into fields. Fields are separated by
commas. A field may be wrapped in double quotes, in which case it can contain commas, and a doubled quote
("") inside it stands for one quote character. Whitespace is kept as is. An empty line is one empty field.
Raise ValueError for an unterminated quoted field. Do not use the csv module.
"""
tests = """
assert split_csv_line("a,b,c") == ["a", "b", "c"]
assert split_csv_line('x,"y, z",w') == ["x", "y, z", "w"]
"""
hidden_tests = """
assert split_csv_line("") == [""]
assert split_csv_line("a,,") == ["a", "", ""]
assert split_csv_line('"say ""hi""\",2') == ['say "hi"', "2"]
assert split_csv_line(' a , b ') == [" a ", " b "]
assert split_csv_line('""') == [""]
assert raises(ValueError, split_csv_line, '"open,field')
"""
reference = '''
def split_csv_line(line):
    fields, current, i, quoted = [], "", 0, False
    while i < len(line):
        ch = line[i]
        if quoted:
            if ch == '"':
                if i + 1 < len(line) and line[i + 1] == '"':
                    current += '"'
                    i += 1
                else:
                    quoted = False
            else:
                current += ch
        elif ch == '"' and current == "":
            quoted = True
        elif ch == ",":
            fields.append(current)
            current = ""
        else:
            current += ch
        i += 1
    if quoted:
        raise ValueError("unterminated quoted field")
    fields.append(current)
    return fields
'''

