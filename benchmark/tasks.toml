id = "flatten_dict"
entry_point = "flatten_dict"
prompt = """
Write flatten_dict(data: dict) -> dict that flattens nested dicts and lists into one level, joining keys with
dots. List items use their index as the key, so {"a": [{"b": 1}]} becomes {"a.0.b": 1}. Empty dicts and
empty lists are kept as values ({"a": {}} stays {"a": {}}). Non-string keys are converted with str().
"""
tests = """
assert flatten_dict({"a": {"b": 1, "c": 2}}) == {"a.b": 1, "a.c": 2}
assert flatten_dict({"a": [{"b": 1}]}) == {"a.0.b": 1}
"""
hidden_tests = """
assert flatten_dict({}) == {}
assert flatten_dict({"a": {}}) == {"a": {}}
assert flatten_dict({"a": [], "b": [1, [2, 3]]}) == {"a": [], "b.0": 1, "b.1.0": 2, "b.1.1": 3}
assert flatten_dict({1: {2: "x"}}) == {"1.2": "x"}
assert flatten_dict({"a": {"b": {"c": None}}}) == {"a.b.c": None}
"""
reference = '''
def flatten_dict(data):
    out = {}

    def walk(value, prefix):
        if isinstance(value, dict) and value:
            items = value.items()
        elif isinstance(value, list) and value:
            items = enumerate(value)
        else:
            out[prefix] = value
            return
        for key, child in items:
            walk(child, f"{prefix}.{key}" if prefix else str(key))

    for key, value in data.items():
        walk(value, str(key))
    return out
'''

