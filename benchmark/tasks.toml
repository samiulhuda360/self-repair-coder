"""
hidden_tests = """
assert parse_query("") == {}
assert parse_query("flag&x=") == {"flag": [""], "x": [""]}
assert parse_query("a=1&&b=2") == {"a": ["1"], "b": ["2"]}
assert parse_query("eq=a=b") == {"eq": ["a=b"]}
assert parse_query("p=100%&q=%zz") == {"p": ["100%"], "q": ["%zz"]}
assert parse_query("k%20ey=v%2Bw") == {"k ey": ["v+w"]}
"""
reference = '''
import re

def parse_query(query):
    def decode(s):
        s = s.replace("+", " ")
        out = bytearray()
        i = 0
        while i < len(s):
            if s[i] == "%" and re.fullmatch(r"[0-9a-fA-F]{2}", s[i + 1:i + 3]):
                out.append(int(s[i + 1:i + 3], 16))
                i += 3
            else:
                out += s[i].encode("utf-8")
                i += 1
        return out.decode("utf-8", errors="replace")

    result = {}
    for piece in query.lstrip("?").split("&"):
        if not piece:
            continue
        key, _, value = piece.partition("=")
        result.setdefault(decode(key), []).append(decode(value))
    return result
'''

