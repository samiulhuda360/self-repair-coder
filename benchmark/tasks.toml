# One test per line; `raises(Error, fn, *args)` is True when the call raises Error.

[[task]]
id = "slugify"
entry_point = "slugify"
prompt = """
Write slugify(text: str) -> str that turns a title into a URL slug. Lowercase everything, turn accented
letters into their plain ASCII letter (e -> e for an accented e), drop any other non-ASCII characters,
replace every run of characters that are not a-z or 0-9 with a single hyphen, and strip hyphens from both
ends. Return an empty string if nothing is left.
"""
tests = """
assert slugify("Hello World") == "hello-world"
assert slugify("  Already--slugged  ") == "already-slugged"
assert slugify("Crème Brûlée") == "creme-brulee"
"""
hidden_tests = """
assert slugify("") == ""
assert slugify("!!!") == ""
assert slugify("C++ & Python 3.12") == "c-python-3-12"
assert slugify("Ünïcödé Straße") == "unicode-strae"
assert slugify("日本 tokyo") == "tokyo"
assert slugify("a_b") == "a-b"
"""
reference = '''
import re
import unicodedata

def slugify(text):
    ascii_text = unicodedata.normalize("NFKD", text).encode("ascii", "ignore").decode("ascii")
    return re.sub(r"[^a-z0-9]+", "-", ascii_text.lower()).strip("-")
'''

