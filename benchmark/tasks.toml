entry_point = "humanize_bytes"
prompt = """
Write humanize_bytes(n: int) -> str that formats a byte count with binary units. Below 1024 return the
whole number with " B" (for example "512 B"). Otherwise divide by 1024 until the value is below 1024 and
format it with one decimal place and the unit KiB, MiB, GiB, TiB or PiB (for example "1.5 KiB"). Stop at
PiB even for larger values. Negative numbers keep their sign: -2048 -> "-2.0 KiB".
"""
tests = """
assert humanize_bytes(512) == "512 B"
assert humanize_bytes(1536) == "1.5 KiB"
"""
hidden_tests = """
assert humanize_bytes(0) == "0 B"
assert humanize_bytes(1023) == "1023 B"
assert humanize_bytes(1024) == "1.0 KiB"
assert humanize_bytes(-2048) == "-2.0 KiB"
assert humanize_bytes(1024 ** 3 * 5) == "5.0 GiB"
assert humanize_bytes(1024 ** 6) == "1024.0 PiB"
"""
reference = '''
def humanize_bytes(n):
    sign = "-" if n < 0 else ""
    value = abs(n)
    if value < 1024:
        return f"{sign}{value} B"
    units = ["KiB", "MiB", "GiB", "TiB", "PiB"]
    value = value / 1024
    unit = 0
    while value >= 1024 and unit < len(units) - 1:
        value /= 1024
        unit += 1
    return f"{sign}{value:.1f} {units[unit]}"
'''

[[task]]
id = "lru_cache"
entry_point = "LRUCache"
prompt = """
Write a class LRUCache(capacity: int) with get(key) and put(key, value). get returns the value, or -1 if the
key is missing, and counts as a use. put inserts or updates a key and counts as a use; when the cache is over
capacity it evicts the least recently used key. len(cache) returns the number of keys stored. A capacity of 0
stores nothing.
"""
tests = """
c = LRUCache(2); c.put(1, 1); c.put(2, 2); assert c.get(1) == 1
c = LRUCache(2); c.put(1, 1); c.put(2, 2); c.put(3, 3); assert c.get(1) == -1
"""
hidden_tests = """
c = LRUCache(2); c.put(1, 1); c.put(2, 2); c.get(1); c.put(3, 3); assert c.get(2) == -1 and c.get(1) == 1
c = LRUCache(2); c.put(1, 1); c.put(2, 2); c.put(1, 10); c.put(3, 3); assert c.get(1) == 10 and c.get(2) == -1
c = LRUCache(0); c.put(1, 1); assert c.get(1) == -1 and len(c) == 0
c = LRUCache(3); c.put("a", 1); c.put("b", 2); assert len(c) == 2
"""
reference = '''
from collections import OrderedDict

class LRUCache:
    def __init__(self, capacity):
        self.capacity = capacity
        self.data = OrderedDict()

    def get(self, key):
        if key not in self.data:
            return -1
        self.data.move_to_end(key)
        return self.data[key]

    def put(self, key, value):
        self.data[key] = value
        self.data.move_to_end(key)
        while len(self.data) > self.capacity:
            self.data.popitem(last=False)

    def __len__(self):
        return len(self.data)
'''

