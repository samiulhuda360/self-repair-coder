assert next_permutation([1, 5, 1]) == [5, 1, 1]
assert next_permutation([]) == []
assert next_permutation([7]) == [7]
assert next_permutation([2, 2]) == [2, 2]
data = [1, 3, 2]; out = next_permutation(data); assert data == [1, 3, 2] and out == [2, 1, 3]
"""
reference = '''
def next_permutation(nums):
    a = list(nums)
    i = len(a) - 2
    while i >= 0 and a[i] >= a[i + 1]:
        i -= 1
    if i < 0:
        return sorted(a)
    j = len(a) - 1
    while a[j] <= a[i]:
        j -= 1
    a[i], a[j] = a[j], a[i]
    a[i + 1:] = reversed(a[i + 1:])
    return a
'''

