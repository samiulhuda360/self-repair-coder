id = "luhn_valid"
entry_point = "luhn_valid"
prompt = """
Write luhn_valid(number: str) -> bool that checks a card-style number with the Luhn checksum. Spaces are
allowed anywhere and ignored. Any other non-digit character makes it invalid. After removing spaces, a
string with fewer than 2 digits is invalid.
"""
tests = """
assert luhn_valid("4539 3195 0343 6467") is True
assert luhn_valid("8273 1232 7352 0569") is False
"""
hidden_tests = """
assert luhn_valid("0") is False
assert luhn_valid(" 0") is False
assert luhn_valid("0 0") is True
assert luhn_valid("059") is True
assert luhn_valid("055-444-285") is False
assert luhn_valid("091") is True
assert luhn_valid("") is False
"""
reference = '''
def luhn_valid(number):
    digits = number.replace(" ", "")
    if len(digits) < 2 or not digits.isdigit() or not digits.isascii():
        return False
    total = 0
    for i, ch in enumerate(reversed(digits)):
        d = int(ch)
        if i % 2 == 1:
            d = d * 2 - 9 if d > 4 else d * 2
        total += d
    return total % 10 == 0
'''

