id = "parse_query"
entry_point = "parse_query"
prompt = """
Write parse_query(query: str) -> dict[str, list[str]] that parses a URL query string without using urllib.
A leading "?" is ignored. Split on "&" and skip empty pieces. Split each piece on the first "="; a piece with
no "=" has the value "". In keys and values, "+" means a space, and %XX escapes are decoded as UTF-8 bytes; a
"%" not followed by two hex digits is kept as is. Repeated keys collect their values in order.
"""
tests = """
assert parse_query("a=1&b=2&a=3") == {"a": ["1", "3"], "b": ["2"]}
assert parse_query("?q=hello+world") == {"q": ["hello world"]}
