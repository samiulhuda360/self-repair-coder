id = "topo_sort"
entry_point = "topo_sort"
prompt = """
Write topo_sort(deps: dict[str, list[str]]) -> list[str]. deps maps each item to the items it depends on.
Return every item (including items that only appear as dependencies) in an order where each item comes after
all of its dependencies. When several items are ready at the same time, take them in alphabetical order.
Raise ValueError if there is a cycle.
"""
tests = """
assert topo_sort({"app": ["db", "cache"], "db": [], "cache": []}) == ["cache", "db", "app"]
"""
hidden_tests = """
assert topo_sort({}) == []
assert topo_sort({"b": ["a"]}) == ["a", "b"]
assert topo_sort({"c": [], "b": [], "a": []}) == ["a", "b", "c"]
assert topo_sort({"z": ["y"], "y": ["x"], "a": ["x"]}) == ["x", "a", "y", "z"]
assert raises(ValueError, topo_sort, {"a": ["b"], "b": ["a"]})
assert raises(ValueError, topo_sort, {"a": ["a"]})
"""
reference = '''
import heapq

def topo_sort(deps):
    nodes = set(deps)
    for needs in deps.values():
        nodes.update(needs)
    remaining = {n: set(deps.get(n, [])) for n in nodes}
    users = {n: [] for n in nodes}
    for node, needs in remaining.items():
        for need in needs:
            users[need].append(node)
    ready = [n for n, needs in remaining.items() if not needs]
    heapq.heapify(ready)
    order = []
    while ready:
        node = heapq.heappop(ready)
        order.append(node)
        for user in users[node]:
            remaining[user].discard(node)
            if not remaining[user]:
                heapq.heappush(ready, user)
    if len(order) != len(nodes):
        raise ValueError("cycle")
    return order
'''

