id = "business_days"
entry_point = "business_days"
prompt = """
Write business_days(start: str, end: str) -> int. Both arguments are ISO dates ("YYYY-MM-DD"). Count the
weekdays (Monday to Friday) from start, inclusive, to end, exclusive. If end is before start, return the
negative of business_days(end, start).
"""
tests = """
assert business_days("2024-01-01", "2024-01-08") == 5
assert business_days("2024-01-01", "2024-01-01") == 0
"""
hidden_tests = """
assert business_days("2024-01-06", "2024-01-08") == 0
assert business_days("2024-01-05", "2024-01-06") == 1
assert business_days("2024-01-08", "2024-01-01") == -5
assert business_days("2024-02-26", "2024-03-04") == 5
assert business_days("2023-12-25", "2024-12-25") == 262
"""
reference = '''
from datetime import date, timedelta

def business_days(start, end):
    a, b = date.fromisoformat(start), date.fromisoformat(end)
    if b < a:
        return -business_days(end, start)
    weeks, extra = divmod((b - a).days, 7)
    count = weeks * 5
    for i in range(extra):
        if (a + timedelta(days=i)).weekday() < 5:
            count += 1
    return count
'''

