id = "evaluate_expression"
entry_point = "evaluate"
prompt = """
Write evaluate(expr: str) -> float that evaluates an arithmetic expression without using eval(). Support
numbers (integers and decimals), + - * /, ^ for powers, parentheses, unary minus and unary plus, and spaces.
Precedence from high to low: ^, then unary minus/plus, then * and /, then + and -. ^ is right-associative and
binds tighter than unary minus, so -2^2 is -4 and 2^3^2 is 512, while an exponent may itself start with a
minus (2^-1 is 0.5). Always return a float. Raise ValueError for malformed input and let ZeroDivisionError
propagate for division by zero.
"""
tests = """
assert evaluate("1 + 2 * 3") == 7.0
assert evaluate("2^3^2") == 512.0
assert evaluate("-2^2") == -4.0
assert raises(ValueError, evaluate, "2 +")
"""
hidden_tests = """
assert evaluate("(1 + 2) * 3") == 9.0
assert evaluate("2^-1") == 0.5
assert evaluate("--3") == 3.0
assert evaluate("7 / 2") == 3.5
assert evaluate("1.5 * 4") == 6.0
assert raises(ZeroDivisionError, evaluate, "1 / 0")
assert raises(ValueError, evaluate, "(1 + 2")
assert raises(ValueError, evaluate, "")
assert raises(ValueError, evaluate, "2 3")
assert raises(ValueError, evaluate, "__import__('os')")
"""
reference = '''
import re

def evaluate(expr):
    tokens = re.findall(r"\d+\.\d+|\d+|[-+*/^()]|\S", expr)
    if not tokens:
        raise ValueError("empty")
    pos = 0

    def peek():
        return tokens[pos] if pos < len(tokens) else None

    def take():
        nonlocal pos
        tok = peek()
        if tok is None:
            raise ValueError("unexpected end")
        pos += 1
        return tok

    def expression():
        value = term()
        while peek() in ("+", "-"):
            value = value + term() if take() == "+" else value - term()
        return value

    def term():
        value = unary()
        while peek() in ("*", "/"):
            value = value * unary() if take() == "*" else value / unary()
        return value

    def unary():
        if peek() in ("-", "+"):
            return -unary() if take() == "-" else unary()
        return power()

    def power():
        base = atom()
        if peek() == "^":
            take()
            return base ** unary()
        return base

    def atom():
        tok = take()
        if tok == "(":
            value = expression()
            if take() != ")":
                raise ValueError("missing )")
            return value
        if re.fullmatch(r"\d+(\.\d+)?", tok):
            return float(tok)
        raise ValueError(f"unexpected {tok!r}")

    result = expression()
    if pos != len(tokens):
        raise ValueError("trailing input")
    return float(result)
'''

