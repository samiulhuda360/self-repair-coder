id = "merge_intervals"
entry_point = "merge_intervals"
prompt = """
Write merge_intervals(intervals: list[list[int]]) -> list[list[int]]. The input is a list of [start, end]
pairs in any order. Merge pairs that overlap or touch (they share an end point), and return the merged pairs
sorted by start. Do not modify the input list.
"""
tests = """
assert merge_intervals([[1, 3], [2, 6], [8, 10]]) == [[1, 6], [8, 10]]
assert merge_intervals([]) == []
"""
hidden_tests = """
assert merge_intervals([[1, 2], [2, 3]]) == [[1, 3]]
assert merge_intervals([[5, 7], [1, 2]]) == [[1, 2], [5, 7]]
assert merge_intervals([[1, 10], [2, 3], [4, 5]]) == [[1, 10]]
assert merge_intervals([[3, 3]]) == [[3, 3]]
data = [[4, 5], [1, 4]]; merge_intervals(data); assert data == [[4, 5], [1, 4]]
"""
reference = '''
def merge_intervals(intervals):
    merged = []
    for start, end in sorted(intervals):
        if merged and start <= merged[-1][1]:
            merged[-1][1] = max(merged[-1][1], end)
        else:
            merged.append([start, end])
    return merged
'''

[[task]]
id = "parse_duration"
entry_point = "parse_duration"
prompt = """
Write parse_duration(text: str) -> int that returns the number of seconds in a duration such as "1h30m",
"45s" or "2d 4h". Units are d, h, m and s, each written after a whole number. Spaces between parts are
allowed. Each unit may appear at most once and units must be in the order d, h, m, s. Raise ValueError for
an empty string, an unknown unit, a number without a unit, a repeated unit or units out of order.
"""
tests = """
assert parse_duration("1h30m") == 5400
assert parse_duration("45s") == 45
assert raises(ValueError, parse_duration, "")
"""
hidden_tests = """
assert parse_duration("2d 4h") == 187200
assert parse_duration("1d2h3m4s") == 93784
assert parse_duration(" 10m ") == 600
assert raises(ValueError, parse_duration, "10")
assert raises(ValueError, parse_duration, "5x")
assert raises(ValueError, parse_duration, "1m1m")
assert raises(ValueError, parse_duration, "1s1m")
"""
reference = '''
import re

def parse_duration(text):
    parts = re.findall(r"\s*(\d+)([a-z]?)\s*", text)
    if not text.strip() or "".join(n + u for n, u in parts) != re.sub(r"\s+", "", text):
        raise ValueError(text)
    scale = {"d": 86400, "h": 3600, "m": 60, "s": 1}
    order = "dhms"
    total, last = 0, -1
    for number, unit in parts:
        if unit not in scale:
            raise ValueError(text)
        position = order.index(unit)
        if position <= last:
            raise ValueError(text)
        last = position
        total += int(number) * scale[unit]
    return total
'''

