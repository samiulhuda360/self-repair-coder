id = "balanced"
entry_point = "balanced"
prompt = """
Write balanced(text: str) -> bool that checks whether the brackets (), [] and {} in text are balanced and
properly nested. Brackets inside single-quoted or double-quoted strings are ignored. A backslash inside a
quoted string escapes the next character. An unterminated quoted string makes the text unbalanced.
"""
tests = """
assert balanced("f(a[1], {b: 2})") is True
assert balanced("(]") is False
"""
hidden_tests = """
assert balanced("") is True
assert balanced("print(')')") is True
assert balanced('x = "[" + y') is True
assert balanced('s = "\\\\"" + (') is False
assert balanced("'unterminated (") is False
assert balanced("(((") is False
assert balanced("a)b(") is False
assert balanced('say("it\\'s (fine)")') is True
"""
reference = '''
def balanced(text):
    pairs = {")": "(", "]": "[", "}": "{"}
    stack = []
    quote = None
    escaped = False
    for ch in text:
        if quote:
            if escaped:
                escaped = False
            elif ch == "\\":
                escaped = True
            elif ch == quote:
                quote = None
        elif ch in "'\"":
            quote = ch
        elif ch in "([{":
            stack.append(ch)
        elif ch in pairs:
            if not stack or stack.pop() != pairs[ch]:
                return False
    return quote is None and not stack
'''

