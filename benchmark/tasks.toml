id = "roman_to_int"
entry_point = "roman_to_int"
prompt = """
Write roman_to_int(s: str) -> int that converts an upper-case Roman numeral (I, V, X, L, C, D, M, with the
usual subtractive pairs IV, IX, XL, XC, CD, CM) into an integer from 1 to 3999. Raise ValueError for an empty
string, any other character, or a numeral that is not in canonical form (for example "IIII", "VX" or "IC").
"""
tests = """
assert roman_to_int("III") == 3
assert roman_to_int("MCMXCIV") == 1994
assert raises(ValueError, roman_to_int, "")
"""
hidden_tests = """
assert roman_to_int("MMMCMXCIX") == 3999
assert roman_to_int("XLII") == 42
assert raises(ValueError, roman_to_int, "IIII")
assert raises(ValueError, roman_to_int, "VX")
assert raises(ValueError, roman_to_int, "IC")
assert raises(ValueError, roman_to_int, "abc")
assert raises(ValueError, roman_to_int, "MMMM")
"""
reference = '''
def roman_to_int(s):
    values = [(1000, "M"), (900, "CM"), (500, "D"), (400, "CD"), (100, "C"), (90, "XC"),
              (50, "L"), (40, "XL"), (10, "X"), (9, "IX"), (5, "V"), (4, "IV"), (1, "I")]

    def to_roman(n):
        out = ""
        for value, sym in values:
            while n >= value:
                out += sym
                n -= value
        return out

    if not s or any(ch not in "IVXLCDM" for ch in s):
        raise ValueError(s)
    total, i = 0, 0
    for value, sym in values:
        while s.startswith(sym, i):
            total += value
            i += len(sym)
    if i != len(s) or not 1 <= total <= 3999 or to_roman(total) != s:
        raise ValueError(s)
    return total
'''

