id = "top_k_words"
entry_point = "top_k_words"
prompt = """
Write top_k_words(text: str, k: int) -> list[tuple[str, int]] that returns the k most common words with
their counts. Words are runs of the letters a-z and apostrophes, matched case-insensitively and reported in
lower case. Sort by count, highest first, and break ties alphabetically. Return fewer than k items if there
are fewer distinct words, and [] when k <= 0.
"""
tests = """
assert top_k_words("the cat and the hat", 1) == [("the", 2)]
assert top_k_words("b a b a c", 2) == [("a", 2), ("b", 2)]
"""
hidden_tests = """
assert top_k_words("Don't stop, don't STOP!", 2) == [("don't", 2), ("stop", 2)]
assert top_k_words("x", 5) == [("x", 1)]
assert top_k_words("one two", 0) == []
assert top_k_words("", 3) == []
assert top_k_words("Zeta zeta alpha beta beta 42 beta", 3) == [("beta", 3), ("zeta", 2), ("alpha", 1)]
"""
reference = '''
import re
from collections import Counter

def top_k_words(text, k):
    if k <= 0:
        return []
    counts = Counter(re.findall(r"[a-z']+", text.lower()))
    return sorted(counts.items(), key=lambda item: (-item[1], item[0]))[:k]
'''

